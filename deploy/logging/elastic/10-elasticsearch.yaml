# Elasticsearch for the IMS log stream, reconciled by the ECK operator
# (install-operator.sh).
#
# One node holding every role (master, data, ingest). ECK generates:
#   - a self-signed CA and HTTPS certificate   -> Secret ims-es-es-http-certs-public
#   - the `elastic` superuser password         -> Secret ims-es-es-elastic-user
#   - the Service ims-es-es-http:9200 (HTTPS)
# With a single node, replicas cannot be allocated: the logs-ims index template
# (index-setup/) sets number_of_replicas: 0 so the cluster stays green.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: ims-es
spec:
  version: 9.5.5
  nodeSets:
    - name: default
      count: 1
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              # The JVM heap is sized automatically to half the memory limit (2 GiB).
              resources:
                requests:
                  cpu: 500m
                  memory: 4Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data   # ECK requires this exact name
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: microk8s-hostpath
            resources:
              requests:
                storage: 20Gi
