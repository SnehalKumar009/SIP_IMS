# Heplify-Server: receives HEPv3 frames from every IMS pod (UDP/9060), decodes them,
# and writes SIP capture data into the Homer PostgreSQL store. Exposes Prometheus
# metrics on :9096.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heplify-server-config
  namespace: monitoring
data:
  heplify-server.toml: |
    HEPAddr           = "0.0.0.0:9060"
    HEPTCPAddr        = "0.0.0.0:9060"
    ESAddr            = ""
    DBShema           = "homer7"
    DBDriver          = "postgres"
    DBAddr            = "homer-postgres.monitoring.svc.cluster.local:5432"
    DBUser            = "homer"
    DBPass            = "homer-change-me"
    DBDataTable       = "homer_data"
    DBConfTable       = "homer_config"
    DBBulk            = 200
    DBTimer           = 2
    DBWorker          = 4
    Dedup             = false
    DiscardMethod     = []
    LogDbg            = ""
    LogLvl            = "info"
    PromAddr          = "0.0.0.0:9096"
    PromTargetIP      = ""
    PromTargetName    = ""
---
apiVersion: v1
kind: Service
metadata:
  name: heplify-server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: heplify-server
spec:
  selector:
    app.kubernetes.io/name: heplify-server
  ports:
    - name: hep-udp
      port: 9060
      targetPort: 9060
      protocol: UDP
    - name: hep-tcp
      port: 9060
      targetPort: 9060
      protocol: TCP
    - name: metrics
      port: 9096
      targetPort: 9096
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heplify-server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: heplify-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heplify-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heplify-server
    spec:
      containers:
        - name: heplify-server
          image: sipcapture/heplify-server:1.30
          command: ["./heplify-server"]
          args: ["-config", "/config/heplify-server.toml"]
          ports:
            - containerPort: 9060
              name: hep-udp
              protocol: UDP
            - containerPort: 9060
              name: hep-tcp
              protocol: TCP
            - containerPort: 9096
              name: metrics
          readinessProbe:
            tcpSocket:
              port: 9096
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: heplify-server-config

# Once you apply this yaml, 
# Here are the checklist
# 1) 1. Pod is running
# kubectl -n monitoring get pods -l app.kubernetes.io/name=heplify-server

# 2) Logs — did it load your toml?
# kubectl -n monitoring logs -l app.kubernetes.io/name=heplify-server
#   On a successful start with your config you should see lines like:

# staging heplify-server ... / version banner
# creating new heplify-server ...
# listener bind messages for 9060 (HEP) and 9096 (Prometheus)
# a PostgreSQL connect line to homer-postgres...:5432 (proves it read DBAddr from your toml)


# 3) Confirm the mounted toml is actually your file
# kubectl -n monitoring exec deploy/heplify-server -- cat /config/heplify-server.toml

# 4. Ports are listening
# kubectl -n monitoring exec deploy/heplify-server -- sh -c "netstat -lnup 2>/dev/null; netstat -lntp 2>/dev/null"

# 5. Metrics endpoint responds (functional proof)
# kubectl -n monitoring port-forward deploy/heplify-server 9096:9096
# # then in another shell:
# curl -s localhost:9096/metrics | grep heplify

# 6. End-to-end: did a capture land?
# kubectl -n monitoring logs deploy/heplify-server | grep -i "packet\|hep\|insert"

