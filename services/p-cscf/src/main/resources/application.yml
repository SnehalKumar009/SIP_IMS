spring:
  application:
    name: p-cscf

server:
  # Actuator / management HTTP port (scraped by the ims-pods ServiceMonitor).
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: p-cscf

# Shared Jain SIP stack (shared-telecom-lib). Signaling entry point on 5060.
ims:
  sip:
    enabled: true
    stack-name: p-cscf
    host: 0.0.0.0
    port: 5060
    transport: udp
  hep:
    enabled: true
    host: heplify-server.monitoring.svc.cluster.local
    port: 9060
    capture-agent-id: 2011
  pcscf:
    self-host: ${POD_IP:127.0.0.1}
    self-port: 5060
    next-hop:
      host: i-cscf.ims-core.svc.cluster.local
      port: 5060
      transport: udp
    rate-limit:
      enabled: true
      capacity: 50
      refill-tokens: 50
      refill-period-seconds: 1
