spring:
  application:
    name: s-cscf
  # Only contacted when ims.scscf.store=redis; the connection factory is lazy.
  data:
    redis:
      host: redis.ims-core.svc.cluster.local
      port: 6379
      timeout: 500ms
  # Charging records to the CDF (ims.scscf.charging.mode=kafka).
  kafka:
    bootstrap-servers: ims-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # A billing record must survive a broker failover and not be duplicated by a retry.
      acks: all
      properties:
        enable.idempotence: true
        # Never hold a SIP thread longer than this when Kafka is unreachable.
        max.block.ms: 500
        # Give up (and log the record at ERROR) after 30 s of failed retries. Kafka
        # requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 5

server:
  # Actuator / management HTTP port (scraped by the ims-pods ServiceMonitor).
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis is optional; its health must not hold the pod out of service when unused.
    redis:
      enabled: false
  metrics:
    tags:
      application: s-cscf

# gRPC Cx interface toward the HSS.
grpc:
  client:
    hss:
      address: dns:///hss.ims-core.svc.cluster.local:9090
      negotiation-type: plaintext
      # Connect the channel at startup, not on the first Cx call (see I-CSCF note).
      immediate-connect-timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      hssCx:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      hssCx:
        # Caps how much of the Jain SIP thread pool can be blocked inside the HSS.
        max-concurrent-calls: 16
        max-wait-duration: 50ms

ims:
  # Stamped into every log line as service.version (Maven resource filtering).
  service-version: '@project.version@'
  sip:
    enabled: true
    stack-name: s-cscf
    host: 0.0.0.0
    port: 5060
    transport: udp
  hep:
    enabled: true
    host: heplify-server.monitoring.svc.cluster.local
    port: 9060
    capture-agent-id: 2013
  scscf:
    # Must be the pod's own routable address: the HSS stores it as this subscriber's
    # serving S-CSCF and the I-CSCF routes terminating requests straight back to it.
    self-host: ${POD_IP:127.0.0.1}
    self-port: 5060
    home-domain: ims.snehal.com
    # Blank derives sip:<self-host>:<self-port>.
    server-name: ""
    store: memory
    registration:
      default-expires: 600
      min-expires: 600
      max-expires: 3600
      max-bindings-per-aor: 5
      reaper-interval: PT30S
    auth:
      algorithm: MD5
      nonce-lifetime: 5m
      max-outstanding-nonces: 50000
    rate-limit:
      enabled: true
      capacity: 10
      refill-tokens: 10
      refill-period-seconds: 60
    routing:
      max-spirals: 2
      default-max-forwards: 70
      draining-retry-after-seconds: 30
    cx:
      timeout: 750ms
      max-concurrent-calls: 16
      max-wait: 50ms
    charging:
      # kafka: records to the ims-charging topic for the CDF; log: structured log only.
      mode: kafka
      topic: ims-charging
      # A call with no BYE after this long is closed with endReason=TIMEOUT.
      max-session-duration: 12h

# Verbose signaling trace. Drop to INFO once the flows are familiar.
logging:
  level:
    com.snehal.ims: DEBUG
